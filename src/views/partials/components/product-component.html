<li>
	<div class="card bg-base-100 shadow">
		<figure class="relative">
			<button class="btn btn-circle btn-ghost btn-sm absolute top-4 right-4 z-10 bg-base-100">
				<span class="sr-only">Wishlist</span>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					fill="none"
					viewBox="0 0 24 24"
					stroke-width="1.5"
					stroke="currentColor"
					class="size-4"
				>
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"
					></path>
				</svg>
			</button>
			<img
				src="<%= randomImageUrl() %>"
				alt=""
				class="h-64 w-full object-cover sm:h-72"
			/>
		</figure>
		<div class="card-body">
			<div class="flex flex-wrap gap-2">
				<% product.tags.forEach(tag => { %> <%- include('./tag-component.html',
				{tag: tag}) %> <%}) %>
			</div>
			<h3 class="card-title"><%= product.name %></h3>
			<p><%=product.price%>€</p>
			<div class="card-actions">
				<a href="/products/<%= product._id %>" class="btn btn-primary w-full">
					Ver producto
				</a>
			</div>
		</div>
	</div>
</li>
