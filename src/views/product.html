<%- include('partials/start-page.html', {title: title}) %>
<%- include('partials/components/header-component.html') %>
<main class="px-4 py-4 sm:px-6">
	<h2 class="text-xl font-bold text-base-content text-center mb-8 sm:text-3xl"><%= title %></h2>
	<form method="POST" action="/products<%= values._id ? '/edit/' + values._id : '' %>" class="card bg-base-200 mx-auto max-w-md">
		<div class="card-body gap-4">
			<fieldset class="fieldset p-0">
				<label class="label" for="name">Nombre</label>
				<input type="text" id="name" name="name" value="<%=values.name ?? ''%>" class="input w-full" />
			</fieldset>

			<fieldset class="fieldset p-0">
				<label class="label" for="price">Precio</label>
				<input type="number" id="price" name="price" value="<%=values.price ?? ''%>" class="input w-full" />
			</fieldset>

			<fieldset class="fieldset p-0">
				<legend class="fieldset-legend">Etiquetas</legend>
				<div class="flex flex-col items-start gap-2">
					<% tags.forEach(tag=> { %>
					<label class="label cursor-pointer justify-start gap-2" for="<%=tag%>">
						<input
							type="checkbox"
							name="tags"
							value="<%=tag%>"
							id="<%=tag%>"
							class="checkbox"
							<%= values.tags?.includes(tag) ? 'checked' : '' %>
						/>
						<span class="label-text"><%=tag%></span>
					</label>
					<%})%>
				</div>
			</fieldset>

			<% if(errorMessage) { %>
			<div role="alert" class="alert alert-error">
				<span><%= errorMessage %></span>
			</div>
			<% } %>

			<div class="card-actions justify-end">
				<a href="/products" class="btn btn-ghost">Cancelar</a>
				<button type="submit" class="btn btn-primary">Guardar</button>
			</div>
		</div>
	</form>
</main>
<%- include('partials/end-page.html') %>
