<%- include('partials/start-page.html', {title: title}) %>
<div class="mx-auto max-w-full px-4 py-8 sm:px-6 sm:py-12 lg:px-8">
	<h2 class="text-xl font-bold text-base-content text-center mb-8 sm:text-3xl">
		<%= title %>
	</h2>

	<% if(errorMessage) { %>
	<div role="alert" class="alert alert-error mx-auto max-w-md mb-4">
		<span><%= errorMessage %></span>
	</div>
	<%}%>

	<form method="POST" class="card bg-base-200 mx-auto max-w-md">
		<div class="card-body gap-4">
			<fieldset class="fieldset p-0">
				<label class="label" for="username">Nombre</label>
				<input
					class="input w-full"
					id="username"
					name="username"
					type="text"
					placeholder="Introduce tu nombre"
					value="<%= values.username ?? '' %>"
				/>
			</fieldset>

			<fieldset class="fieldset p-0">
				<label class="label" for="email">Email</label>
				<input
					class="input w-full"
					id="email"
					name="email"
					type="email"
					placeholder="Introduce tu email"
					value="<%= values.email ?? '' %>"
				/>
			</fieldset>

			<fieldset class="fieldset p-0">
				<label class="label" for="password">Contraseña</label>
				<input class="input w-full" id="password" name="password" type="password" />
			</fieldset>

			<fieldset class="fieldset p-0">
				<label class="label" for="confirm-password">Confirmar contraseña</label>
				<input
					class="input w-full"
					id="confirm-password"
					name="confirmPassword"
					type="password"
				/>
			</fieldset>

			<button class="btn btn-primary w-full" type="submit">Registrar usuario</button>
			<a href="/" class="btn btn-ghost w-full">Volver a inicio</a>
		</div>
	</form>
</div>

<%- include('partials/end-page.html') %>
