services:
  nodepop:
    image: gmoralrubio/nodepop:latest
    container_name: nodepop
    restart: always
    depends_on:
      - mongo_server
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: nodepop
      SESSION_SECRET: ${SESSION_SECRET}

  mongo_server:
    image: mongo:7.0-jammy
    container_name: mongo-server
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    restart: always

volumes:
  mongo-data:
